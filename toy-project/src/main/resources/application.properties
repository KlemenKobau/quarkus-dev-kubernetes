quarkus.package.jar.type=mutable-jar
quarkus.live-reload.password=devpassword
# Dev Services (Testcontainers) requires Docker. Disable for environments without Docker.
# Remove these lines if Docker is available to get automatic PostgreSQL container spin-up in tests.
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/devdb
%test.quarkus.datasource.username=devuser
%test.quarkus.datasource.password=devpassword
